<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Список вакансий | Job Portal</title>
    <div th:replace="~{fragments :: header-css}"></div>
</head>
<body class="container">

<div th:replace="~{fragments :: navbar}"></div>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Доступные вакансии</h1>
    <a href="/vacancies/add" class="btn btn-success">Опубликовать вакансию</a>
</div>

<table class="table table-hover table-bordered shadow-sm">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Описание</th>
        <th>Зарплата</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="v : ${allVacancies}">
        <td th:text="${v.id}">1</td>
        <td class="fw-bold" th:text="${v.title}">Заголовок</td>
        <td th:text="${v.description}">Описание</td>
        <td>
            <a th:href="@{/vacancies/edit/{id}(id=${v.id})}" class="btn btn-warning btn-sm">Изменить</a>

            <a th:if="${v.id != null}"
               th:href="@{/vacancies/delete/{id}(id=${v.id})}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('Удалить?')">Удалить</a>
        </td>
        <td>
            <span th:text="${v.salary}">0</span>
            <small class="text-muted">сом</small>
        </td>
        <td>
            <a th:if="${v.id != null}"
               th:href="@{/vacancies/delete/{id}(id=${v.id})}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('Вы уверены, что хотите удалить эту вакансию?')">
                Удалить
            </a>
        </td>
    </tr>
    </tbody>
</table>

<div th:if="${allVacancies == null || allVacancies.isEmpty()}" class="alert alert-warning text-center">
    Пока нет ни одной вакансии. Будьте первым!
</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
