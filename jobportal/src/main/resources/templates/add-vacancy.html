<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Добавить вакансию</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h2>Разместить новую вакансию</h2>
<form th:action="@{/vacancies/save}" th:object="${vacancy}" method="post" class="col-md-6">
    <div class="mb-3">
        <label class="form-label">Название должности</label>
        <input type="text" th:field="*{title}" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Описание</label>
        <textarea th:field="*{description}" class="form-control"></textarea>
    </div>
    <div class="mb-3">
        <label class="form-label">Зарплата (в сомах)</label>
        <input type="number" th:field="*{salary}" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Опубликовать</button>
</form>
</body>
</html>
